<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulação de Piso Piezelétrico - FECART</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; color: white; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background: rgba(15, 20, 30, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { font-size: 16px; margin-bottom: 5px; color: #00d2ff; }
        p { font-size: 12px; color: #aaa; }
        .legenda-item { display: flex; align-items: center; margin: 5px 0; font-size: 13px; }
        .cor-box { width: 14px; height: 14px; display: inline-block; margin-right: 8px; border-radius: 3px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <h2>Piso Gerador de Energia</h2>
        <p>Conversão mecânica-elétrica via efeito piezoelétrico.</p>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <strong>Escala de Tráfego</strong>
        <div class="legenda-item"><span class="cor-box" style="background:#00FF00;"></span> Verde (1 pessoa)</div>
        <div class="legenda-item"><span class="cor-box" style="background:#FFFF00;"></span> Amarelo (2 pessoas)</div>
        <div class="legenda-item"><span class="cor-box" style="background:#FF0000;"></span> Vermelho (3 pessoas)</div>
        <div class="legenda-item"><span class="cor-box" style="background:#800080;"></span> Roxo (4+ pessoas)</div>
    </div>

    <script>
        // Configuração básica da Cena 3D
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // Função para definir a cor do rastro com base na quantidade de pessoas (Legenda)
        function obterCorRastro(quantidadePessoas) {
            if (quantidadePessoas === 1) return 0x00FF00; // Verde
            if (quantidadePessoas === 2) return 0xFFFF00; // Amarelo
            if (quantidadePessoas === 3) return 0xFF0000; // Vermelho
            if (quantidadePessoas >= 4) return 0x800080;  // Roxo
            return 0x555555;                              // Cinza/Preto padrão
        }

        // Exemplo de criação de rastro mais grosso
        // No Three.js padrão, usamos LineBasicMaterial (limitado a 1px em alguns browsers) 
        // ou Tubos/Planes para espessura real. Aqui usamos espessura simulada ou Shader/LineMaterial se aplicável:
        function criarRastro(pontos, qtdPessoas) {
            const geometry = new THREE.BufferGeometry().setFromPoints(pontos);
            
            // Se estiver usando LineMaterial do Three.js (addons/lines), você pode definir 'linewidth' em pixels.
            // Exemplo genérico com material básico ajustado:
            const cor = obterCorRastro(qtdPessoas);
            const material = new THREE.LineBasicMaterial({ 
                color: cor, 
                linewidth: 5 // Nota: o WebGL limita nativamente a largura de linhas simples a 1px em muitos sistemas operacionais.
            });

            const linha = new THREE.Line(geometry, material);
            scene.add(linha);
        }

        // Exemplo de uso para desenhar uma trajetória com 3 pessoas (Vermelho)
        const pontosExemplo = [
            new THREE.Vector3(-5, 0, -5),
            new THREE.Vector3(0, 0, 2),
            new THREE.Vector3(5, 0, 5)
        ];
        criarRastro(pontosExemplo, 3); // Vai pintar de vermelho e aplicar espessura

        // Loop de Animação
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Ajustar tela ao redimensionar a janela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
