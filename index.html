<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fecart - Piezoeletricidade</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0b0e14;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Barra de Navegação no Topo */
    .nav-tabs {
      display: flex;
      gap: 12px;
      background-color: #161b22;
      padding: 12px 24px;
      border-bottom: 1px solid #30363d;
      z-index: 100;
    }

    .tab-btn {
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: #30363d;
      color: #ffffff;
    }

    .tab-btn.active {
      background: #1f6feb;
      color: #ffffff;
      border-color: #388bfd;
    }

    /* Container Principal das Abas */
    .tab-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 57px);
    }

    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
    }

    .tab-content.active {
      display: block;
    }

    /* Área da Nova Aba */
    #nova-aba {
      padding: 40px;
      background-color: #0d1117;
      overflow-y: auto;
    }

    .card-placeholder {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Menu Superior de Abas -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="openTab(event, 'simulacao')">Simulação 3D</button>
    <button class="tab-btn" onclick="openTab(event, 'nova-aba')">Nova Funcionalidade</button>
  </nav>

  <!-- Container Geral -->
  <div class="tab-container">
    
    <!-- ABA 1: Simulação Atual -->
    <div id="simulacao" class="tab-content active">
      <!-- COLE O CONTEÚDO DA SUA SIMULAÇÃO AQUI (Canvas, Telemetria, Sidebar, etc) -->
    </div>

    <!-- ABA 2: Nova Funcionalidade -->
    <div id="nova-aba" class="tab-content">
      <h1>Nova Área do Projeto</h1>
      <p>Este espaço está reservado para a nova aba sem interferir no dashboard principal.</p>
      
      <div class="card-placeholder">
        <h3>Painel de Conteúdo</h3>
        <p>Insira aqui seus gráficos, tabelas, relatórios ou novos dados do piso piezoelétrico.</p>
      </div>
    </div>

  </div>

  <!-- Lógica das Abas -->
  <script>
    function openTab(evt, tabName) {
      // Oculta todas as abas
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      // Remove destaque dos botões
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      // Ativa a aba e o botão selecionados
      document.getElementById(tabName).classList.add('active');
      evt.currentTarget.classList.add('active');

      // Garante o ajuste de tela da biblioteca 3D ao retornar para a simulação
      if (tabName === 'simulacao') {
        window.dispatchEvent(new Event('resize'));
      }
    }
  </script>

</body>
</html>
